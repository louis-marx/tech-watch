repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # Project tools, at the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: no-abbreviated-names
        name: no abbreviated or one-letter names
        language: pygrep
        types: [python]
        entry: '\bfor\s+[a-z]\s+in\b|\bas\s+[a-z]\s*[:,)]|\blambda\s+[a-z]\s*:|^\s*[a-z]\s*=[^=]|(?<![A-Za-z])(msg|err|cfg|tmp(?!_path)|val|ctx|idx|num|cnt|secs)(?![A-Za-z])'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, toml]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
