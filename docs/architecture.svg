<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#525252"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="1200" height="640" rx="16" fill="#fafaf9"/>
  <text x="30" y="34" font-size="13" font-weight="600" fill="#a3a3a3">tech-watch — un outil installable et paramétrable</text>

  <!-- ===== Dépôt GitHub (hors installation) ===== -->
  <rect x="30" y="85" width="190" height="150" rx="14" fill="#fff" stroke="#e5e5e5"/>
  <circle cx="56" cy="113" r="11" fill="#171717"/>
  <path d="M51 110 l3 3 -3 3 M57 117 h5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="118" font-size="14" font-weight="600" fill="#171717">Dépôt GitHub</text>
  <g font-size="12" fill="#525252">
    <text x="46" y="152">· présentation</text>
    <text x="46" y="174">· installation</text>
    <text x="46" y="196">· config d'exemple</text>
  </g>
  <text x="46" y="220" font-size="10.5" fill="#a3a3a3">la vitrine du projet</text>

  <line x1="222" y1="160" x2="268" y2="160" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="150" font-size="10.5" fill="#737373" text-anchor="middle">installer</text>

  <!-- ===== Flux RSS (web) ===== -->
  <rect x="30" y="360" width="190" height="100" rx="14" fill="#fff" stroke="#e5e5e5"/>
  <rect x="46" y="378" width="16" height="16" rx="4" fill="#f97316"/>
  <circle cx="50" cy="390" r="1.6" fill="#fff"/>
  <path d="M49.5 385 A5.5 5.5 0 0 1 55.5 391 M49.5 381.5 A9 9 0 0 1 59 391" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="70" y="391" font-size="14" font-weight="600" fill="#171717">Flux RSS</text>
  <text x="46" y="420" font-size="11" fill="#737373">articles publiés sur le web</text>
  <text x="46" y="438" font-size="11" fill="#737373">(blogs, médias, newsletters)</text>

  <!-- ===== Installation chez l'utilisateur ===== -->
  <rect x="250" y="50" width="740" height="570" rx="20" fill="none" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="268" y="72" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.5">CHEZ L'UTILISATEUR</text>

  <!-- Paramétrage -->
  <rect x="270" y="85" width="700" height="148" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="288" y="106" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.5">PARAMÉTRAGE <tspan font-weight="400" letter-spacing="0">· propre à chaque utilisateur</tspan></text>
  <text x="955" y="106" font-size="10.5" fill="#a78bfa" text-anchor="end">cadence &amp; diffusion : à définir</text>

  <g fill="#fff" stroke="#e5e5e5">
    <rect x="300" y="118" width="170" height="95" rx="10"/>
    <rect x="535" y="118" width="170" height="95" rx="10"/>
    <rect x="770" y="118" width="170" height="95" rx="10"/>
  </g>
  <g font-size="13" font-weight="600" fill="#171717">
    <text x="314" y="142">Mes sources</text>
    <text x="549" y="142">Mon profil</text>
    <text x="784" y="142">Mon podcast</text>
  </g>
  <g font-size="11" fill="#737373">
    <text x="314" y="164">liste de flux RSS</text>
    <text x="314" y="181">import Feedly (OPML)</text>
    <text x="549" y="198">défis · ambitions</text>
    <text x="784" y="164">format · durée · voix</text>
    <text x="784" y="181">ex. dialogue 2 voix, 20 min</text>
  </g>
  <rect x="549" y="154" width="72" height="22" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="585" y="169" font-size="10.5" fill="#92400e" text-anchor="middle">court terme</text>
  <rect x="627" y="154" width="70" height="22" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="662" y="169" font-size="10.5" fill="#1e40af" text-anchor="middle">long terme</text>

  <!-- Moteur -->
  <rect x="270" y="265" width="700" height="340" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="955" y="596" font-size="11" font-weight="700" fill="#a8a29e" letter-spacing="0.5" text-anchor="end">MOTEUR <tspan font-weight="400" letter-spacing="0">· identique pour tous</tspan></text>

  <!-- paramétrage -> moteur -->
  <g stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="385" y1="215" x2="385" y2="296" marker-end="url(#arrow-soft)"/>
    <line x1="620" y1="215" x2="620" y2="296" marker-end="url(#arrow-soft)"/>
    <line x1="855" y1="215" x2="855" y2="296" marker-end="url(#arrow-soft)"/>
  </g>
  <g font-size="10.5" fill="#8b5cf6">
    <text x="393" y="254">quelles sources</text>
    <text x="628" y="254">quels sujets, quel dosage</text>
    <text x="863" y="254">quel format</text>
  </g>

  <g font-size="14" font-weight="700" fill="#171717" text-anchor="middle">
    <text x="385" y="314">① Collecter</text>
    <text x="620" y="314">② Choisir</text>
    <text x="855" y="314">③ Raconter</text>
  </g>

  <g fill="#fff" stroke="#e5e5e5">
    <rect x="285" y="326" width="200" height="50" rx="10"/>
    <rect x="285" y="386" width="200" height="50" rx="10"/>
    <rect x="520" y="326" width="200" height="50" rx="10"/>
    <rect x="520" y="386" width="200" height="50" rx="10"/>
    <rect x="520" y="446" width="200" height="50" rx="10"/>
    <rect x="755" y="326" width="200" height="50" rx="10"/>
    <rect x="755" y="386" width="200" height="50" rx="10"/>
    <rect x="755" y="446" width="200" height="50" rx="10"/>
  </g>
  <g font-size="13" font-weight="600" fill="#171717">
    <text x="299" y="347">Veille des sources</text>
    <text x="299" y="407">Lecture</text>
    <text x="534" y="347">Regroupement</text>
    <text x="534" y="407">Sélection</text>
    <text x="534" y="467">Dosage</text>
    <text x="769" y="347">Conducteur</text>
    <text x="769" y="407">Dialogue</text>
    <text x="769" y="467">Mise en voix</text>
  </g>
  <g font-size="11" fill="#737373">
    <text x="299" y="364">repérer les nouveautés</text>
    <text x="299" y="424">texte complet des articles</text>
    <text x="534" y="364">même actu = 1 sujet</text>
    <text x="534" y="424">pertinence pour l'utilisateur</text>
    <text x="534" y="484">court terme / long terme</text>
    <text x="769" y="364">quoi dire, dans quel ordre</text>
    <text x="769" y="424">script selon le format</text>
    <text x="769" y="484">audio de l'épisode</text>
  </g>
  <rect x="660" y="460" width="24" height="6" rx="3" fill="#fcd34d"/>
  <rect x="678" y="460" width="16" height="6" rx="3" fill="#93c5fd"/>

  <line x1="487" y1="411" x2="518" y2="411" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="722" y1="411" x2="753" y2="411" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Mémoire -->
  <g stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="385" y1="438" x2="385" y2="518"/>
    <line x1="620" y1="498" x2="620" y2="518"/>
    <line x1="855" y1="498" x2="855" y2="518"/>
  </g>
  <rect x="285" y="520" width="670" height="55" rx="10" fill="#fff" stroke="#e5e5e5"/>
  <ellipse cx="313" cy="538" rx="10" ry="4" fill="none" stroke="#78716c" stroke-width="1.6"/>
  <path d="M303 538 V556 A10 4 0 0 0 323 556 V538 M303 547 A10 4 0 0 0 323 547" fill="none" stroke="#78716c" stroke-width="1.6"/>
  <text x="335" y="545" font-size="13" font-weight="600" fill="#171717">Mémoire</text>
  <text x="335" y="563" font-size="11" fill="#737373">articles lus · sujets déjà racontés · historique des épisodes</text>

  <!-- web -> Collecter -->
  <line x1="222" y1="380" x2="283" y2="380" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="372" font-size="10.5" fill="#737373">articles</text>

  <!-- Raconter -> podcast -->
  <line x1="957" y1="411" x2="1018" y2="411" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="986" y="403" font-size="10.5" fill="#737373" text-anchor="middle">épisode</text>

  <!-- ===== Podcast ===== -->
  <rect x="1020" y="330" width="160" height="170" rx="14" fill="#fff" stroke="#e5e5e5"/>
  <rect x="1036" y="346" width="44" height="44" rx="9" fill="url(#cover)"/>
  <rect x="1042" y="355" width="20" height="13" rx="4" fill="#fff"/>
  <rect x="1053" y="367" width="20" height="13" rx="4" fill="#fff" fill-opacity="0.65"/>
  <text x="1036" y="414" font-size="14" font-weight="600" fill="#171717">Son podcast</text>
  <text x="1036" y="432" font-size="11" fill="#737373">épisode personnalisé</text>
  <g fill="#7c3aed">
    <rect x="1036" y="463" width="4" height="10" rx="2"/>
    <rect x="1044" y="459" width="4" height="18" rx="2"/>
    <rect x="1052" y="455" width="4" height="26" rx="2"/>
    <rect x="1060" y="461" width="4" height="14" rx="2"/>
    <rect x="1068" y="453" width="4" height="30" rx="2"/>
    <rect x="1116" y="456" width="4" height="24" rx="2"/>
    <rect x="1124" y="450" width="4" height="36" rx="2"/>
    <rect x="1132" y="458" width="4" height="20" rx="2"/>
    <rect x="1140" y="461" width="4" height="14" rx="2"/>
  </g>
  <g fill="#db2777">
    <rect x="1076" y="457" width="4" height="22" rx="2"/>
    <rect x="1084" y="462" width="4" height="12" rx="2"/>
    <rect x="1092" y="451" width="4" height="34" rx="2"/>
    <rect x="1100" y="454" width="4" height="28" rx="2"/>
    <rect x="1108" y="460" width="4" height="16" rx="2"/>
    <rect x="1148" y="455" width="4" height="26" rx="2"/>
    <rect x="1156" y="459" width="4" height="18" rx="2"/>
    <rect x="1164" y="463" width="4" height="10" rx="2"/>
  </g>
</svg>
